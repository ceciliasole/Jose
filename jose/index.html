<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Sílabas y Sonidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: cuatro actividades arriba, escenario grande a la izquierda y guía para el adulto a la derecha (apilada en pantallas angostas).
   Color con significado: vocales en coral, consonantes en azul, igual que en el material impreso. */
:root{
  --bg:#EEF3F9; --surface:#FFFFFF; --surface-2:#E3EBF5; --ink:#18222F; --ink-2:#4A586B; --line:#C5D1E1;
  --cons:#1B65A8; --on-cons:#FFFFFF; --vowel:#C0392F; --on-vowel:#FFFFFF;
  --ok:#1F7A4D; --ok-bg:#DDF2E6; --warn:#8A5A00; --warn-bg:#FFF1CC;
  --font-display:'Fredoka','Lexend',system-ui,sans-serif;
  --font-body:'Lexend',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1620; --surface:#18222F; --surface-2:#223046; --ink:#EAF1FA; --ink-2:#A6B5C8; --line:#324259;
    --cons:#6CB2F2; --on-cons:#0B1A2B; --vowel:#FF8F84; --on-vowel:#2A0D0A;
    --ok:#5FD39A; --ok-bg:#153A2A; --warn:#FFCF70; --warn-bg:#3A2E10; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1620; --surface:#18222F; --surface-2:#223046; --ink:#EAF1FA; --ink-2:#A6B5C8; --line:#324259;
  --cons:#6CB2F2; --on-cons:#0B1A2B; --vowel:#FF8F84; --on-vowel:#2A0D0A;
  --ok:#5FD39A; --ok-bg:#153A2A; --warn:#FFCF70; --warn-bg:#3A2E10; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.c{color:var(--cons)} .v{color:var(--vowel)}
.app{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:16px 40px;display:grid;gap:16px}

.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-family:var(--font-display);font-size:1.7rem;font-weight:600;margin:0;letter-spacing:.01em}
.tag{font-size:.8rem;color:var(--ink-2);border:1.5px solid var(--line);border-radius:999px;padding:2px 10px}
.sw{min-height:48px;padding:0 16px;border:2px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);font-size:.95rem;font-weight:500;cursor:pointer}
.sw[aria-pressed="true"]{border-color:var(--cons)}

.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:640px){.tabs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tab{display:flex;align-items:center;gap:10px;min-height:64px;padding:8px 12px;border:2px solid var(--line);background:var(--surface);border-radius:14px;color:var(--ink);cursor:pointer;text-align:left;font-size:.98rem;font-weight:500}
.tab[aria-selected="true"]{border-color:var(--cons);background:var(--surface-2)}
.tab .g{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:10px;background:var(--bg);font-weight:700;font-size:1.15rem}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:880px){.layout{grid-template-columns:minmax(0,1fr)}}
.stage{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:18px;align-items:center;min-height:520px}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;width:100%}
.q{font-family:var(--font-display);font-size:1.5rem;font-weight:500;margin:0;text-align:center;text-wrap:balance}

.seg{display:inline-flex;border:2px solid var(--line);border-radius:14px;overflow:hidden}
.seg button{min-height:48px;padding:0 18px;border:0;background:transparent;font-size:1rem;font-weight:600;color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--cons);color:var(--on-cons)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{width:56px;height:56px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-size:1.5rem;font-weight:700;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--cons);color:var(--on-cons);border-color:var(--cons)}
.prog{display:flex;gap:8px}
.prog i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink-2)}
.prog i.on{background:var(--ok);border-color:var(--ok)}

.pic{font-size:clamp(5.5rem,22vw,8.5rem);line-height:1;width:min(100%,250px);aspect-ratio:1;display:grid;place-items:center;background:var(--surface-2);border-radius:24px}
.row{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.btn{min-height:56px;padding:0 26px;border-radius:14px;border:2px solid var(--cons);background:var(--cons);color:var(--on-cons);font-size:1.1rem;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--cons)}
.btn[hidden]{display:none}

.tile{position:relative;width:clamp(84px,22vw,120px);aspect-ratio:1;border-radius:18px;border:0;font-size:clamp(2.6rem,9vw,3.8rem);font-weight:700;cursor:pointer;display:grid;place-items:center}
.tile.c{background:var(--cons);color:var(--on-cons)}
.tile.v{background:var(--vowel);color:var(--on-vowel)}
.tile:disabled{cursor:default}
.ok-mark::after{content:"✓";position:absolute;top:-10px;right:-10px;width:34px;height:34px;border-radius:50%;background:var(--ok);color:#fff;font-size:1.2rem;display:grid;place-items:center;line-height:34px;text-align:center}
.tile.ok{outline:5px solid var(--ok);outline-offset:3px}
.miss{opacity:.4;outline:3px dashed var(--warn);outline-offset:2px}

.syl{position:relative;min-height:84px;border-radius:16px;border:3px solid var(--line);background:var(--surface);font-size:clamp(1.8rem,6vw,2.4rem);font-weight:700;letter-spacing:.04em;cursor:pointer;color:var(--ink)}
.syl.ok{border-color:var(--ok);background:var(--ok-bg)}
.syl:disabled{cursor:default}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;width:100%;max-width:560px}
@media (max-width:420px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}

.target{font-size:clamp(3rem,12vw,4.6rem);font-weight:700;letter-spacing:.06em;min-height:84px;display:grid;place-items:center}
.slots{display:flex;gap:14px;justify-content:center}
.slot{width:clamp(96px,26vw,124px);height:clamp(110px,30vw,140px);border:3px dashed var(--line);border-radius:18px;background:var(--bg);font-size:clamp(3rem,11vw,4rem);font-weight:700;cursor:pointer;color:var(--ink)}
.slot.f{border-style:solid;border-color:var(--ink-2);background:var(--surface)}
.slot.good{border-color:var(--ok);background:var(--ok-bg)}

.counts{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.count{width:104px;min-height:96px;border-radius:18px;border:3px solid var(--line);background:var(--surface);display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;padding:12px;cursor:pointer;position:relative}
.count i{width:16px;height:16px;border-radius:50%;background:var(--ink)}
.count.ok{border-color:var(--ok);background:var(--ok-bg)}
.sylrow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.sy{min-width:64px;padding:10px 14px;border:3px solid var(--line);border-radius:14px;background:var(--surface);font-size:1.7rem;font-weight:700;text-align:center;letter-spacing:.04em}
.sy.hot{border-color:var(--cons);background:var(--surface-2);transform:scale(1.1)}

.fb{min-height:44px;font-size:1.15rem;font-weight:500;text-align:center;border-radius:12px;padding:6px 14px}
.fb.good{background:var(--ok-bg);color:var(--ok)}
.fb.try{background:var(--warn-bg);color:var(--warn)}
.end{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;flex:1}
.end h2{font-family:var(--font-display);font-size:2rem;margin:0}
.end p{margin:0;color:var(--ink-2);max-width:34ch}
.badge{width:84px;height:84px;border-radius:50%;background:var(--ok);color:#fff;font-size:3rem;display:grid;place-items:center;line-height:84px}

.adult{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:12px}
.adult h2{font-family:var(--font-display);font-size:1.15rem;font-weight:600;margin:0}
.say{background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:1.2rem;font-weight:600}
.adult p{margin:0;color:var(--ink-2);font-size:.95rem}
.adult .note{font-size:.82rem;border-top:1.5px solid var(--line);padding-top:10px}

@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.shake{animation:shake .35s}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
.pop{animation:pop .3s}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}.sy.hot{transform:none}}
</style>

<div class="app">
  <header class="top">
    <div class="brand"><h1>Sílabas y Sonidos</h1><span class="tag">Prototipo de prueba</span></div>
    <button class="sw" id="snd" aria-pressed="true">Voz y sonidos: sí</button>
  </header>

  <nav class="tabs" role="tablist" aria-label="Actividades">
    <button class="tab" role="tab" data-t="sonido" aria-selected="true"><span class="g"><span class="v">A</span></span>Primer sonido</button>
    <button class="tab" role="tab" data-t="armar" aria-selected="false"><span class="g"><span class="c">M</span><span class="v">A</span></span>Armar sílabas</button>
    <button class="tab" role="tab" data-t="buscar" aria-selected="false"><span class="g"><span class="c">T</span></span>Buscar sílabas</button>
    <button class="tab" role="tab" data-t="contar" aria-selected="false"><span class="g">3</span>Contar sílabas</button>
  </nav>

  <div class="layout">
    <main class="stage" id="stage"></main>
    <aside class="adult" aria-label="Guía para el adulto">
      <h2>Para el adulto</h2>
      <div class="say" id="adultSay"></div>
      <p id="adultTip"></p>
      <p class="note">Textos de ejemplo, a revisar y reescribir por la psicopedagoga. No hay tiempo ni puntaje: cada actividad espera.</p>
    </aside>
  </div>
</div>

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s);};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
var VOWELS='AEIOUÁÉÍÓÚ';
var VOW=['A','E','I','O','U'];
var isV=function(l){return VOWELS.indexOf(l)>-1;};
var NAMES={A:'a',E:'e',I:'i',O:'o',U:'u',F:'efe',L:'ele',M:'eme',N:'ene',P:'pe',S:'ese',T:'te'};
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function sample(a,n){return shuffle(a).slice(0,n);}
function L(l){return '<span class="'+(isV(l)?'v':'c')+'">'+l+'</span>';}
function S(s){return Array.from(s).map(L).join('');}
function dots(n,t){var h='';for(var k=0;k<t;k++){h+='<i class="'+(k<n?'on':'')+'"></i>';}return '<div class="prog" aria-label="'+n+' de '+t+'">'+h+'</div>';}

/* ---------- Voz y sonidos ---------- */
var soundOn=true, ctx=null, voice=null;
function pickVoice(){
  try{
    var vs=speechSynthesis.getVoices();
    voice=vs.filter(function(v){return v.lang==='es-AR'||v.lang==='es_AR';})[0]
      ||vs.filter(function(v){return /^es[-_](MX|US|419)/i.test(v.lang);})[0]
      ||vs.filter(function(v){return /^es/i.test(v.lang);})[0]||null;
  }catch(e){}
}
try{speechSynthesis.addEventListener('voiceschanged',pickVoice);pickVoice();}catch(e){}
function say(text,rate){
  if(!soundOn)return;
  try{
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);
    u.lang=voice?voice.lang:'es-AR'; if(voice)u.voice=voice;
    u.rate=rate||0.8; u.pitch=1.05;
    speechSynthesis.speak(u);
  }catch(e){}
}
function tone(freqs,dur,type,vol){
  if(!soundOn)return;
  try{
    ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
    if(ctx.state==='suspended')ctx.resume();
    var t=ctx.currentTime;
    freqs.forEach(function(f){
      var o=ctx.createOscillator(),g=ctx.createGain();
      o.type=type||'sine';o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(vol||0.12,t+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+dur+0.02);
      t+=dur*0.9;
    });
  }catch(e){}
}
var sfx={ok:function(){tone([523,659,784],0.13);},no:function(){tone([300,260],0.14,'triangle',0.08);},tick:function(){tone([880],0.07,'sine',0.1);}};
$('#snd').onclick=function(){
  soundOn=!soundOn;
  this.setAttribute('aria-pressed',String(soundOn));
  this.textContent='Voz y sonidos: '+(soundOn?'sí':'no');
  if(!soundOn){try{speechSynthesis.cancel();}catch(e){}}
};

/* ---------- Piezas comunes ---------- */
var stage=$('#stage');
function setAdult(sayHtml,tip){$('#adultSay').innerHTML=sayHtml;$('#adultTip').textContent=tip;}
function fb(html,kind){var e=$('#fb');if(!e)return;e.className='fb '+(kind||'');e.innerHTML=html;}
function setDots(n,t){var p=$('.prog',stage);if(p)p.outerHTML=dots(n,t);}
function endCard(again){
  stage.innerHTML='<div class="end"><div class="badge" aria-hidden="true">✓</div><h2>¡Ronda completa!</h2><p>No hay puntaje ni tiempo. Cuando quieran, hacen otra ronda.</p><button class="btn" id="again">Otra ronda</button></div>';
  $('#again').onclick=again;
  sfx.ok();say('¡Muy bien! Terminamos la ronda.');
  setAdult('Ronda completa','Celebren juntos. Pueden hacer otra ronda o cambiar de actividad.');
}
function shakeEl(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');}

/* ---------- 1. Primer sonido ---------- */
var SON_V=[
  {w:'imán',e:'🧲',l:'I'},{w:'isla',e:'🏝️',l:'I'},{w:'oso',e:'🐻',l:'O'},{w:'oveja',e:'🐑',l:'O'},
  {w:'uva',e:'🍇',l:'U'},{w:'águila',e:'🦅',l:'A'},{w:'abeja',e:'🐝',l:'A'},
  {w:'elefante',e:'🐘',l:'E'},{w:'estrella',e:'⭐',l:'E'}
];
var SON_C=[
  {w:'mar',e:'🌊',l:'M'},{w:'mono',e:'🐵',l:'M'},{w:'sol',e:'☀️',l:'S'},{w:'sapo',e:'🐸',l:'S'},
  {w:'luna',e:'🌙',l:'L'},{w:'león',e:'🦁',l:'L'},{w:'pato',e:'🦆',l:'P'},{w:'pez',e:'🐟',l:'P'},
  {w:'tortuga',e:'🐢',l:'T'},{w:'tren',e:'🚆',l:'T'},{w:'flor',e:'🌸',l:'F'},
  {w:'nube',e:'☁️',l:'N'},{w:'nariz',e:'👃',l:'N'}
];
function renderSonido(first){
  var st=renderSonido.st=renderSonido.st||{mode:'V'};
  var letters=st.mode==='V'?['A','E','I','O','U']:['M','S','L','P','T','F','N'];
  var pool=st.mode==='V'?SON_V:SON_C;
  var items=shuffle(pool);
  if(first&&st.mode==='V'){var m=pool[0];items=[m].concat(items.filter(function(x){return x!==m;}));}
  items=items.slice(0,6);
  var i=0,done=0;
  function draw(auto){
    if(i>=items.length){endCard(function(){renderSonido();});return;}
    var it=items[i];
    var opts=shuffle([it.l].concat(sample(letters.filter(function(l){return l!==it.l;}),2)));
    stage.innerHTML=
      '<div class="bar"><div class="seg" role="group" aria-label="Tipo de letra">'+
        '<button data-m="V" aria-pressed="'+(st.mode==='V')+'">Vocales</button>'+
        '<button data-m="C" aria-pressed="'+(st.mode==='C')+'">Consonantes</button></div>'+dots(done,6)+'</div>'+
      '<p class="q">¿Con qué letra empieza?</p>'+
      '<div class="pic pop" role="img" aria-label="Dibujo de '+it.w+'">'+it.e+'</div>'+
      '<button class="btn ghost" id="listen">Escuchar</button>'+
      '<div class="row">'+opts.map(function(l){return '<button class="tile '+(isV(l)?'v':'c')+'" data-l="'+l+'" aria-label="Letra '+l+'">'+l+'</button>';}).join('')+'</div>'+
      '<div class="fb" id="fb" role="status"></div>'+
      '<button class="btn" id="next" hidden>'+(i===items.length-1?'Terminar':'Siguiente')+'</button>';
    setAdult('Decí despacio: «'+it.w+'»','Marcá con la boca el primer sonido. Si se equivoca, repetí la palabra sin decirle la letra y miren la boca en un espejo.');
    $$('.seg button',stage).forEach(function(b){b.onclick=function(){st.mode=b.dataset.m;renderSonido();};});
    $('#listen').onclick=function(){say(it.w);};
    $$('.tile',stage).forEach(function(b){
      b.onclick=function(){
        if(b.dataset.l===it.l){
          $$('.tile',stage).forEach(function(x){x.disabled=true;});
          b.classList.add('ok','ok-mark');
          done++;setDots(done,6);sfx.ok();
          fb(L(it.l)+it.w.slice(1)+' empieza con '+L(it.l),'good');
          say(it.w+'. ¡Muy bien!');
          $('#next').hidden=false;
        }else{
          b.disabled=true;b.classList.add('miss');shakeEl(b);sfx.no();
          fb('Escuchemos otra vez','try');say(it.w);
        }
      };
    });
    $('#next').onclick=function(){i++;draw(true);};
    if(auto)say(it.w);
  }
  draw(false);
}

/* ---------- 2. Armar sílabas ---------- */
function renderArmar(){
  var st=renderArmar.st=renderArmar.st||{sel:['M','P','T','L'],model:true};
  var CONS=['M','P','T','L','S'];
  var targets,i,done,slots,locked;
  function newRound(){
    var all=[];st.sel.forEach(function(c){VOW.forEach(function(v){all.push(c+v);});});
    var t=shuffle(all);while(t.length<6){t=t.concat(shuffle(all));}
    targets=t.slice(0,6);i=0;done=0;slots=[null,null];locked=false;
  }
  function draw(auto){
    if(i>=targets.length){endCard(function(){newRound();draw(false);});return;}
    var t=targets[i];
    var tiles=CONS.filter(function(c){return st.sel.indexOf(c)>-1;}).concat(VOW);
    stage.innerHTML=
      '<div class="bar"><div class="chips" role="group" aria-label="Consonantes a practicar">'+
        CONS.map(function(c){return '<button class="chip" data-c="'+c+'" aria-pressed="'+(st.sel.indexOf(c)>-1)+'">'+c+'</button>';}).join('')+'</div>'+
        '<button class="sw" id="mod" aria-pressed="'+st.model+'">Con modelo: '+(st.model?'sí':'no')+'</button>'+dots(done,6)+'</div>'+
      '<p class="q">Armá la sílaba</p>'+
      (st.model?'<div class="target" aria-label="Modelo: '+t+'">'+S(t)+'</div>':'<div class="target" aria-hidden="true">?</div>')+
      '<button class="btn ghost" id="listen">Escuchar</button>'+
      '<div class="slots">'+[0,1].map(function(k){return '<button class="slot'+(slots[k]?' f':'')+'" data-k="'+k+'" aria-label="Casillero '+(k+1)+'">'+(slots[k]?L(slots[k]):'')+'</button>';}).join('')+'</div>'+
      '<div class="row">'+tiles.map(function(l){return '<button class="tile '+(isV(l)?'v':'c')+'" data-l="'+l+'" aria-label="Letra '+l+'">'+l+'</button>';}).join('')+'</div>'+
      '<div class="fb" id="fb" role="status"></div>'+
      '<button class="btn" id="next" hidden>'+(i===targets.length-1?'Terminar':'Siguiente')+'</button>';
    setAdult('Sílaba: «'+t.toLowerCase()+'»','Primero la consonante, después la vocal. Sin modelo, la sílaba solo se escucha: es un paso más difícil para cuando ya les sale con modelo.');
    $$('.chip',stage).forEach(function(b){
      b.onclick=function(){
        var c=b.dataset.c,k=st.sel.indexOf(c);
        if(k>-1){if(st.sel.length>1)st.sel.splice(k,1);}else{st.sel.push(c);}
        newRound();draw(false);
      };
    });
    $('#mod').onclick=function(){st.model=!st.model;draw(false);};
    $('#listen').onclick=function(){say(t.toLowerCase());};
    $$('.slot',stage).forEach(function(b){
      b.onclick=function(){if(locked)return;slots[+b.dataset.k]=null;draw(false);};
    });
    $$('.tile',stage).forEach(function(b){
      b.onclick=function(){
        if(locked)return;
        var k=slots[0]===null?0:(slots[1]===null?1:-1);
        if(k<0)return;
        slots[k]=b.dataset.l;sfx.tick();
        if(slots[0]!==null&&slots[1]!==null){check(t);}else{draw(false);}
      };
    });
    $('#next').onclick=function(){i++;slots=[null,null];locked=false;draw(true);};
    if(auto)say(t.toLowerCase());
  }
  function check(t){
    locked=true;draw(false);
    var els=$$('.slot',stage);
    if(slots.join('')===t){
      els.forEach(function(e){e.classList.add('good');});
      done++;setDots(done,6);sfx.ok();
      fb(S(t)+' se lee «'+t.toLowerCase()+'»','good');say(t.toLowerCase());
      $$('.tile',stage).forEach(function(x){x.disabled=true;});
      $$('.slot',stage).forEach(function(x){x.disabled=true;});
      $('#next').hidden=false;
    }else{
      els.forEach(shakeEl);sfx.no();
      fb(st.model?'Casi. Mirá el modelo y probá otra vez':'Casi. Escuchemos otra vez','try');
      say(t.toLowerCase());
      setTimeout(function(){slots=[null,null];locked=false;
        var f=$('#fb');var msg=f?f.innerHTML:'';var kind=f?f.className:'';
        draw(false);var f2=$('#fb');if(f2){f2.innerHTML=msg;f2.className=kind;}
      },1100);
    }
  }
  newRound();draw(false);
}

/* ---------- 3. Buscar sílabas ---------- */
function renderBuscar(){
  var st=renderBuscar.st=renderBuscar.st||{c:'T'};
  var CONS=['M','P','T','L','S'];
  var grid,total,found,wrong;
  function newGrid(){
    var k=4+Math.floor(Math.random()*2);
    var good=sample(VOW,k).map(function(v){return st.c+v;});
    var pool=[];CONS.filter(function(c){return c!==st.c;}).forEach(function(c){VOW.forEach(function(v){pool.push(c+v);});});
    grid=shuffle(good.concat(sample(pool,12-good.length)));
    total=good.length;found=[];wrong=[];
  }
  function draw(auto){
    var complete=found.length===total;
    stage.innerHTML=
      '<div class="bar"><div class="chips" role="group" aria-label="Letra a buscar">'+
        CONS.map(function(c){return '<button class="chip" data-c="'+c+'" aria-pressed="'+(st.c===c)+'">'+c+'</button>';}).join('')+'</div>'+
        '<div aria-live="polite"><strong>'+found.length+'</strong> de '+total+'</div></div>'+
      '<p class="q">Buscá las sílabas con '+L(st.c)+'</p>'+
      '<div class="grid">'+grid.map(function(s,k){
        var cls='syl'+(found.indexOf(s)>-1?' ok ok-mark':'')+(wrong.indexOf(s)>-1?' miss':'');
        return '<button class="'+cls+'" data-s="'+s+'"'+((found.indexOf(s)>-1||wrong.indexOf(s)>-1||complete)?' disabled':'')+' aria-label="Sílaba '+s+'">'+S(s)+'</button>';
      }).join('')+'</div>'+
      '<div class="fb" id="fb" role="status"></div>'+
      '<button class="btn" id="again" hidden>Otra tanda</button>';
    setAdult('Buscamos la '+st.c,'Decí el sonido de la letra («'+NAMES[st.c]+'»), no solo el nombre. Pueden leer cada sílaba que encuentren, despacio y juntos.');
    $$('.chip',stage).forEach(function(b){b.onclick=function(){st.c=b.dataset.c;newGrid();draw(true);};});
    $$('.syl',stage).forEach(function(b){
      b.onclick=function(){
        var s=b.dataset.s;
        if(s.charAt(0)===st.c){
          found.push(s);sfx.ok();say(s.toLowerCase());
          draw(false);
          if(found.length===total){
            fb('¡Encontraron todas!','good');$('#again').hidden=false;say('¡Muy bien! Las encontraron todas.');
          }else{fb(S(s)+' tiene la '+L(st.c),'good');}
        }else{
          wrong.push(s);sfx.no();shakeEl(b);
          b.disabled=true;b.classList.add('miss');
          fb('Esa no tiene la '+L(st.c)+'. Seguí buscando.','try');
        }
      };
    });
    $('#again').onclick=function(){newGrid();draw(true);};
    if(auto)say('Buscá las sílabas con '+NAMES[st.c]+'.');
  }
  newGrid();draw(false);
}

/* ---------- 4. Contar sílabas ---------- */
var CONT=[
  {w:'sol',e:'☀️',s:['SOL']},{w:'mar',e:'🌊',s:['MAR']},{w:'tren',e:'🚆',s:['TREN']},
  {w:'pato',e:'🦆',s:['PA','TO']},{w:'luna',e:'🌙',s:['LU','NA']},{w:'casa',e:'🏠',s:['CA','SA']},{w:'mono',e:'🐵',s:['MO','NO']},
  {w:'tortuga',e:'🐢',s:['TOR','TU','GA']},{w:'banana',e:'🍌',s:['BA','NA','NA']},{w:'conejo',e:'🐰',s:['CO','NE','JO']},{w:'tomate',e:'🍅',s:['TO','MA','TE']},
  {w:'mariposa',e:'🦋',s:['MA','RI','PO','SA']},{w:'elefante',e:'🐘',s:['E','LE','FAN','TE']},{w:'teléfono',e:'📞',s:['TE','LÉ','FO','NO']}
];
function renderContar(){
  var items=shuffle(CONT).slice(0,6),i=0,done=0;
  function beat(row,cb){
    var cs=$$('.sy',row);
    cs.forEach(function(c,k){
      setTimeout(function(){
        cs.forEach(function(x){x.classList.remove('hot');});
        c.classList.add('hot');sfx.tick();
        if(k===cs.length-1){setTimeout(function(){c.classList.remove('hot');if(cb)cb();},500);}
      },k*700);
    });
  }
  function draw(auto){
    if(i>=items.length){endCard(function(){renderContar();});return;}
    var it=items[i];
    stage.innerHTML=
      '<div class="bar"><span></span>'+dots(done,6)+'</div>'+
      '<p class="q">¿Cuántas sílabas tiene?</p>'+
      '<div class="pic pop" role="img" aria-label="Dibujo de '+it.w+'">'+it.e+'</div>'+
      '<div class="row"><button class="btn ghost" id="listen">Escuchar</button><button class="btn ghost" id="help">Aplaudamos las sílabas</button></div>'+
      '<div class="sylrow" id="syl" hidden>'+it.s.map(function(x){return '<span class="sy">'+S(x)+'</span>';}).join('')+'</div>'+
      '<div class="counts">'+[1,2,3,4].map(function(n){var d='';for(var k=0;k<n;k++)d+='<i></i>';return '<button class="count" data-n="'+n+'" aria-label="'+n+(n===1?' sílaba':' sílabas')+'">'+d+'</button>';}).join('')+'</div>'+
      '<div class="fb" id="fb" role="status"></div>'+
      '<button class="btn" id="next" hidden>'+(i===items.length-1?'Terminar':'Siguiente')+'</button>';
    setAdult('Decí despacio: «'+it.w+'»','Aplaudan juntos una palma por golpe de voz. Si duda, usen «Aplaudamos las sílabas» y miren cómo se parte la palabra.');
    $('#listen').onclick=function(){say(it.w);};
    $('#help').onclick=function(){
      var row=$('#syl');row.hidden=false;say(it.w);
      setTimeout(function(){beat(row);},1100);
    };
    $$('.count',stage).forEach(function(b){
      b.onclick=function(){
        if(+b.dataset.n===it.s.length){
          $$('.count',stage).forEach(function(x){x.disabled=true;});
          b.classList.add('ok','ok-mark');
          done++;setDots(done,6);sfx.ok();
          fb('«'+it.w+'» tiene '+it.s.length+(it.s.length===1?' sílaba':' sílabas'),'good');
          var row=$('#syl');row.hidden=false;
          say(it.w+'. ¡Muy bien!');
          setTimeout(function(){beat(row);},1500);
          $('#next').hidden=false;
        }else{
          b.disabled=true;b.classList.add('miss');shakeEl(b);sfx.no();
          fb('Probemos otra vez. Aplaudamos juntos.','try');say(it.w);
        }
      };
    });
    $('#next').onclick=function(){i++;draw(true);};
    if(auto)say(it.w);
  }
  draw(false);
}

/* ---------- Navegación ---------- */
var RENDER={sonido:renderSonido,armar:renderArmar,buscar:renderBuscar,contar:renderContar};
function show(t){
  try{speechSynthesis.cancel();}catch(e){}
  $$('.tab').forEach(function(b){b.setAttribute('aria-selected',String(b.dataset.t===t));});
  RENDER[t](t==='sonido');
}
$$('.tab').forEach(function(b){b.onclick=function(){show(b.dataset.t);};});
show('sonido');
})();
</script>
